# esp_provisioning_shell: default = BLE + SoftAP (see overlay-softap-only.conf / overlay-ble-only.conf).

# Logging — first-level diagnostics (esp_provisioning at INF; revert for quiet builds).
# LOG_MAX_LEVEL must be >= ESP_PROV_LOG_LEVEL or provisioning LOG_* is compiled out.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MAX_LEVEL=3
CONFIG_ESP_PROVISIONING=y
CONFIG_ESP_PROV_LOG_LEVEL=3
CONFIG_ESP_PROV_USE_BLE=y
CONFIG_ESP_PROV_USE_SOFTAP=y

# Console (single-key menu)
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# Heap (protocomm / TLS / Wi-Fi)
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_MAIN_STACK_SIZE=8192

# Wi-Fi driver: concurrent STA + SoftAP net_if (required for working SoftAP transport).
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_ESP32_WIFI_AP_STA_MODE=y

# Networking (SoftAP + HTTP/DNS/DHCP)
CONFIG_NETWORKING=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
# ESP32 SoftAP: ICMP probe before Offer often fails → phone gets no IP (see references/journal.md).
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"
CONFIG_NET_DHCPV4_SERVER_OPTION_CAPTIVE_PORTAL=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_INTERFACE_NAME_LEN=15

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# SoftAP HTTP/DNS (module defaults; explicit for clarity)
CONFIG_ESP_PROV_HTTP_WORKER_STACK_SIZE=16384
CONFIG_ESP_PROV_DNS_STACK_SIZE=6144

# Bluetooth (BLE provisioning transport)
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_DYNAMIC_DB=y
# Conn callbacks + GATT handlers run on the BT RX thread (default 1200 B). sec1 / mbedTLS
# (X25519) on prov writes needs headroom; underflow corrupts threads → EXCCAUSE illegal / z_swap.
CONFIG_BT_RX_STACK_SIZE=4096

# NVS / Settings (BLE keys + wifi_credentials)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Wi-Fi credentials storage
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y

# mbedTLS / TF-PSA for esp_prov_sec1 (do not use CONFIG_ESP32_WIFI_MBEDTLS_CRYPTO: breaks HAL
# wpa_supplicant crypto_mbedtls-ec.c against TF-PSA 4.x on Zephyr 4.4).
CONFIG_MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_PSA_WANT_ALG_CTR=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y

# Option 4: sys_reboot()
CONFIG_REBOOT=y
